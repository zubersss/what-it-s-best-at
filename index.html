<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#000000" />
  <title>Solar System Explorer</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    #hud { position: fixed; left: max(8px, env(safe-area-inset-left)); top: 8px; padding: 6px 9px; font: 11px/1.35 ui-monospace, Menlo, Consolas, monospace;
      color: #d8d8d0; background: rgba(0, 0, 0, 0.55); white-space: pre; pointer-events: none; min-width: 280px; border-radius: 3px; }
    #hud.compact { min-width: 0; padding: 3px 7px; font-size: 10px; background: rgba(0, 0, 0, 0.35); color: #c9c6bb; }
    #timebar { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(8px, env(safe-area-inset-bottom)); padding: 5px 10px;
      font: 11px ui-monospace, Menlo, Consolas, monospace; color: #d8d8d0; background: rgba(0, 0, 0, 0.55); display: flex; gap: 8px;
      align-items: center; border-radius: 3px; white-space: nowrap; }
    #timebar input { width: min(300px, 34vw); height: 22px; touch-action: pan-x; }
    #fatal { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; color: #cfc8ba; z-index: 30; background: #000;
      font: 14px ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; padding: 40px; text-align: center; }
    .hidden { display: none !important; }
    /* the full read-out sits below the touch buttons (it ran under them); nothing of the HUD shows through the menus */
    body:has(#touch:not(.hidden)) #hud:not(.compact) { top: 54px; }
    body:has(#results:not(.hidden)) #hud, body:has(#start:not(.hidden)) #hud { visibility: hidden; }
    /* Start screen, results screen, benchmark banner */
    #start .where { display: block; margin: 10px 0 2px; font-size: 15px; opacity: 0.9; }
    #start .where select { font: inherit; padding: 6px 10px; border-radius: 8px; background: #1b1f27; color: #fff; border: 1px solid #556; }
    #start, #results { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 20;
      background: rgba(4, 3, 2, 0.62); color: #e9e4d8; font: 14px/1.4 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    #results { background: rgba(4, 3, 2, 0.9); align-items: stretch; }
    .card { max-width: min(92vw, 720px); max-height: 94vh; display: flex; flex-direction: column; gap: 10px; padding: 12px 16px; text-align: center; }
    #results .card { max-width: 96vw; width: 96vw; text-align: left; }
    .card h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: 0.02em; }
    .card .sub { margin: 0; color: #b9b0a0; }
    .card .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    #results .row { justify-content: flex-start; }
    .card button { min-height: 44px; padding: 0 16px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.08); color: #f0ebe0; font: 600 14px system-ui, sans-serif; }
    .card button.primary { background: #d9c7a3; color: #1b150c; border-color: #d9c7a3; }
    .card button.mode { align-self: center; font-weight: 500; }
    .card button:disabled { opacity: 0.4; }
    .card .rotate { display: none; margin: 0; color: #e0c98f; font-size: 13px; }
    @media (orientation: portrait) and (pointer: coarse) { .card .rotate { display: block; } }
    #toast { position: fixed; left: 50%; top: 22%; transform: translateX(-50%); z-index: 16; padding: 8px 16px; border-radius: 8px; pointer-events: none;
      background: rgba(0, 0, 0, 0.66); color: #f0ebe0; font: 600 15px system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    /* Target marker: corner brackets, name, distance and trip time; an arrow at the edge when off screen */
    #target { position: fixed; left: 0; top: 0; z-index: 12; pointer-events: none; color: #e6e0d2; }
    #target .box { position: absolute; left: 0; top: 0; opacity: 0.85;
      --c: #e6e0d2; --l: 7px; --t: 1.5px;
      background: linear-gradient(var(--c), var(--c)) left top / var(--l) var(--t) no-repeat, linear-gradient(var(--c), var(--c)) left top / var(--t) var(--l) no-repeat,
        linear-gradient(var(--c), var(--c)) right top / var(--l) var(--t) no-repeat, linear-gradient(var(--c), var(--c)) right top / var(--t) var(--l) no-repeat,
        linear-gradient(var(--c), var(--c)) left bottom / var(--l) var(--t) no-repeat, linear-gradient(var(--c), var(--c)) left bottom / var(--t) var(--l) no-repeat,
        linear-gradient(var(--c), var(--c)) right bottom / var(--l) var(--t) no-repeat, linear-gradient(var(--c), var(--c)) right bottom / var(--t) var(--l) no-repeat; }
    #target .label { position: absolute; left: 0; top: 0; white-space: nowrap; text-align: center; font: 11px/1.3 ui-monospace, Menlo, Consolas, monospace;
      text-shadow: 0 0 3px #000, 0 0 1px #000; }
    #target .label b { display: block; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
    #target .label span { display: block; opacity: 0.9; }
    #target .arrow { position: absolute; left: 0; top: 0; width: 0; height: 0; border-left: 13px solid #e6e0d2; border-top: 7px solid transparent;
      border-bottom: 7px solid transparent; opacity: 0.9; filter: drop-shadow(0 0 2px #000); }
    /* Target list */
    #picker { position: fixed; inset: 0; z-index: 18; display: flex; align-items: center; justify-content: center; background: rgba(4, 3, 2, 0.45); }
    #picker .panel { max-width: min(94vw, 760px); max-height: 88vh; overflow-y: auto; padding: 10px 14px; border-radius: 10px; background: rgba(12, 10, 8, 0.86);
      color: #e9e4d8; font: 13px/1.3 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; touch-action: pan-y; }
    #picker h2 { margin: 6px 2px 6px; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #b9b0a0; }
    #picker .items { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
    #picker button { min-height: 44px; padding: 4px 12px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.22); background: rgba(255, 255, 255, 0.06);
      color: #f0ebe0; text-align: left; font: 13px system-ui, sans-serif; }
    #picker button.on { border-color: #d9c7a3; background: rgba(217, 199, 163, 0.18); }
    #picker button b { display: block; font-weight: 600; }
    #picker button span { display: block; font-size: 11px; color: #b9b0a0; }
    /* Menu */
    #menu { position: fixed; inset: 0; z-index: 18; display: flex; align-items: center; justify-content: center; background: rgba(4, 3, 2, 0.45); }
    #menu .panel { max-width: min(94vw, 760px); max-height: 90vh; overflow-y: auto; padding: 10px 14px; border-radius: 10px; background: rgba(12, 10, 8, 0.88);
      color: #e9e4d8; font: 13px/1.3 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; touch-action: pan-y; }
    #menu h2 { margin: 6px 2px 6px; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #b9b0a0; }
    #menu .note { margin: 0 2px 6px; font: 13px ui-monospace, Menlo, Consolas, monospace; color: #f3e6c8; }
    #menu .items { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; align-items: center; }
    #menu button { min-height: 46px; min-width: 62px; padding: 4px 12px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.22); background: rgba(255, 255, 255, 0.06);
      color: #f0ebe0; text-align: left; font: 13px system-ui, sans-serif; }
    #menu button.on { border-color: #d9c7a3; background: rgba(217, 199, 163, 0.18); }
    #menu button b { display: block; font-weight: 600; }
    #menu button span { display: block; font-size: 11px; color: #b9b0a0; }
    #menu .date { color: #b9b0a0; }
    #menu .date input { font: inherit; padding: 8px; border-radius: 8px; background: #1b1f27; color: #fff; border: 1px solid #556; color-scheme: dark; }
    /* Map */
    #map { position: fixed; inset: 0; z-index: 19; color: #e9e4d8; font: 13px/1.3 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    #map canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
    #map .bar { position: absolute; left: max(8px, env(safe-area-inset-left)); right: max(8px, env(safe-area-inset-right)); top: 8px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    #map .bar .date { margin-left: 8px; font: 13px ui-monospace, Menlo, Consolas, monospace; color: #f3e6c8; }
    #map .bar .x { margin-left: auto; }
    #map button { min-height: 40px; padding: 0 12px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.28); background: rgba(10, 12, 18, 0.8); color: #f0ebe0; font: 600 12px system-ui, sans-serif; }
    #map button.primary { background: #d9c7a3; color: #1b150c; border-color: #d9c7a3; }
    #map .info { position: absolute; right: max(10px, env(safe-area-inset-right)); bottom: 12px; padding: 10px 12px; border-radius: 10px; background: rgba(12, 10, 8, 0.9); max-width: 70vw; }
    #map .info b { display: block; font-size: 16px; }
    #map .info span { display: block; color: #b9b0a0; margin: 2px 0 8px; }
    #map .info div { display: flex; gap: 6px; flex-wrap: wrap; }
    /* Journal, photo bar */
    #journal { position: fixed; inset: 0; z-index: 19; display: flex; align-items: center; justify-content: center; background: rgba(4, 3, 2, 0.6); }
    #journal .panel { width: min(94vw, 760px); max-height: 92vh; overflow-y: auto; padding: 10px 16px 16px; border-radius: 10px; background: rgba(12, 10, 8, 0.93);
      color: #e9e4d8; font: 13px/1.35 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; touch-action: pan-y; }
    #journal h1 { margin: 4px 0 8px; font-size: 17px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    #journal h1 button { min-height: 38px; padding: 0 12px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.28); background: rgba(255, 255, 255, 0.08); color: #f0ebe0; font: 600 12px system-ui, sans-serif; }
    #journal h2 { margin: 12px 0 4px; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #d9c7a3; }
    #journal .place { padding: 6px 2px; border-top: 1px solid rgba(255, 255, 255, 0.08); color: #8f887c; }
    #journal .place.found { color: #e9e4d8; }
    #journal .place b { display: block; font-weight: 600; }
    #journal .place span { display: block; font-size: 12px; color: #b9b0a0; }
    #photobar { position: fixed; left: 50%; bottom: max(10px, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 17; display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
    #photobar button { min-height: 44px; padding: 0 14px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.3); background: rgba(0, 0, 0, 0.55); color: #f0ebe0; font: 600 13px system-ui, sans-serif; }
    #photobar button.primary { background: #d9c7a3; color: #1b150c; border-color: #d9c7a3; }
    .card .status, .card .build { margin: 0; color: #a59c8c; font-size: 12px; }
    #results pre { margin: 0; overflow: auto; flex: 1; padding: 10px; background: rgba(255, 255, 255, 0.06); border-radius: 6px;
      font: 11px/1.4 ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; -webkit-user-select: text; user-select: text; }
    #benchbar { position: fixed; right: max(8px, env(safe-area-inset-right)); top: 8px; z-index: 15; display: flex; gap: 10px; align-items: center;
      padding: 5px 10px; border-radius: 6px; background: rgba(0, 0, 0, 0.6); color: #e9e4d8; font: 12px ui-monospace, Menlo, Consolas, monospace; }
    #benchbar button { height: 30px; padding: 0 10px; border-radius: 6px; border: 1px solid rgba(255, 255, 255, 0.3); background: rgba(255, 255, 255, 0.1); color: #f0ebe0; }
    /* Touch controls (phones) */
    #touch { position: fixed; inset: 0; pointer-events: none; }
    #stick { position: absolute; width: 120px; height: 120px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(0, 0, 0, 0.18); opacity: 0; transition: opacity 0.15s; }
    #stick.on { opacity: 1; }
    #knob { position: absolute; left: 36px; top: 36px; width: 48px; height: 48px; border-radius: 50%; background: rgba(255, 255, 255, 0.28); }
    #tbuttons { position: absolute; right: max(8px, env(safe-area-inset-right)); top: 8px; display: flex; gap: 5px; pointer-events: auto; flex-wrap: wrap; justify-content: flex-end; max-width: 60vw; }
    #tupdown { position: absolute; right: max(10px, env(safe-area-inset-right)); bottom: 64px; display: flex; flex-direction: column; gap: 8px; pointer-events: auto; }
    #touch button { min-width: 46px; height: 38px; padding: 0 6px; border-radius: 6px; border: 1px solid rgba(255, 255, 255, 0.28);
      background: rgba(0, 0, 0, 0.42); color: #e6e2d6; font: 600 11px ui-monospace, Menlo, Consolas, monospace; letter-spacing: 0.04em; touch-action: none; }
    #tupdown button { width: 50px; height: 46px; font-size: 15px; }
    #touch button.on { background: rgba(255, 255, 255, 0.3); }
    #touch button.lit { background: rgba(217, 199, 163, 0.55); color: #1b150c; border-color: #d9c7a3; }
    #touch button.go { border-color: #d9c7a3; color: #f3e6c8; }
    #touch button.go.active { background: rgba(217, 199, 163, 0.55); color: #1b150c; }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="hud"></div>
  <div id="timebar"><span>time</span><input id="time" type="range" min="-12" max="12" step="0.01" value="0" /><span id="timelabel"></span></div>
  <div id="fatal"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
