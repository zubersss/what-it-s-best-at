<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#000000" />
  <title>Solar System Explorer</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    #hud { position: fixed; left: max(8px, env(safe-area-inset-left)); top: 8px; padding: 6px 9px; font: 11px/1.35 ui-monospace, Menlo, Consolas, monospace;
      color: #d8d8d0; background: rgba(0, 0, 0, 0.55); white-space: pre; pointer-events: none; min-width: 280px; border-radius: 3px; }
    #hud.compact { min-width: 0; padding: 3px 7px; font-size: 10px; background: rgba(0, 0, 0, 0.35); color: #c9c6bb; }
    #timebar { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(8px, env(safe-area-inset-bottom)); padding: 5px 10px;
      font: 11px ui-monospace, Menlo, Consolas, monospace; color: #d8d8d0; background: rgba(0, 0, 0, 0.55); display: flex; gap: 8px;
      align-items: center; border-radius: 3px; white-space: nowrap; }
    #timebar input { width: min(300px, 34vw); height: 22px; touch-action: pan-x; }
    #fatal { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; color: #cfc8ba; z-index: 30; background: #000;
      font: 14px ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; padding: 40px; text-align: center; }
    .hidden { display: none !important; }
    /* Start screen, results screen, benchmark banner */
    #start, #results { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 20;
      background: rgba(4, 3, 2, 0.62); color: #e9e4d8; font: 14px/1.4 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    #results { background: rgba(4, 3, 2, 0.9); align-items: stretch; }
    .card { max-width: min(92vw, 720px); max-height: 94vh; display: flex; flex-direction: column; gap: 10px; padding: 12px 16px; text-align: center; }
    #results .card { max-width: 96vw; width: 96vw; text-align: left; }
    .card h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: 0.02em; }
    .card .sub { margin: 0; color: #b9b0a0; }
    .card .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    #results .row { justify-content: flex-start; }
    .card button { min-height: 44px; padding: 0 16px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.08); color: #f0ebe0; font: 600 14px system-ui, sans-serif; }
    .card button.primary { background: #d9c7a3; color: #1b150c; border-color: #d9c7a3; }
    .card button.mode { align-self: center; font-weight: 500; }
    .card button:disabled { opacity: 0.4; }
    .card .rotate { display: none; margin: 0; color: #e0c98f; font-size: 13px; }
    @media (orientation: portrait) and (pointer: coarse) { .card .rotate { display: block; } }
    #toast { position: fixed; left: 50%; top: 22%; transform: translateX(-50%); z-index: 16; padding: 8px 16px; border-radius: 8px; pointer-events: none;
      background: rgba(0, 0, 0, 0.66); color: #f0ebe0; font: 600 15px system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    .card .status, .card .build { margin: 0; color: #a59c8c; font-size: 12px; }
    #results pre { margin: 0; overflow: auto; flex: 1; padding: 10px; background: rgba(255, 255, 255, 0.06); border-radius: 6px;
      font: 11px/1.4 ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; -webkit-user-select: text; user-select: text; }
    #benchbar { position: fixed; right: max(8px, env(safe-area-inset-right)); top: 8px; z-index: 15; display: flex; gap: 10px; align-items: center;
      padding: 5px 10px; border-radius: 6px; background: rgba(0, 0, 0, 0.6); color: #e9e4d8; font: 12px ui-monospace, Menlo, Consolas, monospace; }
    #benchbar button { height: 30px; padding: 0 10px; border-radius: 6px; border: 1px solid rgba(255, 255, 255, 0.3); background: rgba(255, 255, 255, 0.1); color: #f0ebe0; }
    /* Touch controls (phones) */
    #touch { position: fixed; inset: 0; pointer-events: none; }
    #stick { position: absolute; width: 120px; height: 120px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(0, 0, 0, 0.18); opacity: 0; transition: opacity 0.15s; }
    #stick.on { opacity: 1; }
    #knob { position: absolute; left: 36px; top: 36px; width: 48px; height: 48px; border-radius: 50%; background: rgba(255, 255, 255, 0.28); }
    #tbuttons { position: absolute; right: max(8px, env(safe-area-inset-right)); top: 8px; display: flex; gap: 5px; pointer-events: auto; flex-wrap: wrap; justify-content: flex-end; max-width: 60vw; }
    #tupdown { position: absolute; right: max(10px, env(safe-area-inset-right)); bottom: 64px; display: flex; flex-direction: column; gap: 8px; pointer-events: auto; }
    #touch button { min-width: 46px; height: 38px; padding: 0 6px; border-radius: 6px; border: 1px solid rgba(255, 255, 255, 0.28);
      background: rgba(0, 0, 0, 0.42); color: #e6e2d6; font: 600 11px ui-monospace, Menlo, Consolas, monospace; letter-spacing: 0.04em; touch-action: none; }
    #tupdown button { width: 50px; height: 46px; font-size: 15px; }
    #touch button.on { background: rgba(255, 255, 255, 0.3); }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="hud"></div>
  <div id="timebar"><span>time</span><input id="time" type="range" min="-12" max="12" step="0.01" value="0" /><span id="timelabel"></span></div>
  <div id="fatal"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
